<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Fuhrpark</title>
<style>
*{box-sizing:border-box}
:root{--blue:#17324d;--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#68747e;--line:#e5e9ed;--green:#18864b;--orange:#b56b00;--red:#b42318}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,.card,.panel,.nav-tabs button,.tab{transition:transform .16s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.985)}
.card:active{transform:scale(.997)}
/* Startschutz: vor der fertigen PIN-/Datenprüfung darf keine App-Seite aufblitzen. */
body.booting header,body.booting main,body.booting .fab{visibility:hidden}
body.booting::before{content:"";position:fixed;inset:0;z-index:99997;background:#f4f6f8;}
body.booting::after{content:"";position:fixed;inset:0;z-index:99998;display:block;background:#f4f6f8;}
/* Sanfte Einblendungen für Seiten, Dialoge und alle interaktiven Schaltflächen. */
@keyframes buttonFeedback{0%{transform:scale(1)}45%{transform:scale(.965)}100%{transform:scale(1)}}
.button-animate{animation:buttonFeedback .24s ease-out both!important}
/* Animationsklasse wird bei jedem Seitenwechsel per JavaScript neu gestartet. */
@keyframes pageZoomFade{from{opacity:0;transform:scale(.975) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes softFade{from{opacity:.65}to{opacity:1}}
.page-enter{animation:pageZoomFade .32s cubic-bezier(.2,.7,.2,1) both!important;transform-origin:center top;will-change:opacity,transform}
.tab.active{animation:pageZoomFade .24s ease-out both;transform-origin:center top}
.card,.panel{transition:transform .16s ease,box-shadow .2s ease,border-color .2s ease}
.card:focus-within,.panel:focus-within{border-color:#dce4eb}
#appLock{opacity:1;transition:opacity .2s ease}
#appLock:not(.hidden){opacity:1}
#appLock .lock-card{transform:translateY(5px) scale(.99);transition:transform .2s ease}
#appLock:not(.hidden) .lock-card{transform:translateY(0) scale(1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
body{min-height:100vh}
header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{font-size:21px;margin:0;font-weight:750}
.sub{font-size:12px;opacity:.78;margin-top:3px}
main{max-width:560px;margin:auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.search{width:100%;height:48px;border:0;border-radius:14px;padding:0 15px;font-size:16px;background:#fff;box-shadow:0 1px 5px #00000010;margin-bottom:10px}
button{border:0;border-radius:13px;min-height:46px;padding:11px 14px;background:var(--blue);color:#fff;font-size:15px;font-weight:650}
button.secondary{background:#e7edf2;color:var(--blue)}
button.dangerBtn{background:#f8dddd;color:var(--red)}
button:active{transform:scale(.98)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.primaryAction{width:100%;height:50px}
.card,.panel{background:var(--card);border:1px solid #edf0f2;border-radius:17px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #00000009}
.card{cursor:pointer}
.vehicle-top{display:flex;align-items:center;gap:11px}
.vehicle-icon{width:44px;height:44px;border-radius:13px;background:#e8eef3;display:grid;place-items:center;font-size:23px;flex:none}
.title{font-size:17px;font-weight:750}
.muted{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.badge{padding:5px 9px;border-radius:20px;background:#e8f4ea;color:#176b3d;font-size:11px;font-weight:700;white-space:nowrap}
.badge.warn{background:#fff0cf;color:#8a5200}.badge.danger{background:#f9dddd;color:#a51e14}
.empty{text-align:center;padding:30px 10px;color:#78838b}
.section-title{font-size:14px;font-weight:750;margin:16px 3px 7px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:9px 0}.stat.full-width{grid-column:1/-1}.stat.term-green{background:#e8f4ea;border-color:#b8dfc2}.stat.term-yellow{background:#fff0cf;border-color:#f0d28a}.stat.term-red{background:#f9dddd;border-color:#e9a8a3}
.stat{background:#fff;border-radius:15px;padding:12px;border:1px solid #edf0f2}
.stat span{font-size:11px;color:var(--muted)}.stat b{display:block;font-size:18px;margin-top:4px}
.notice{padding:11px;border-radius:13px;background:#fff0cf;margin:8px 0;font-size:12px}
.notice.success{background:#e8f4ea}
.back{width:100%;margin-bottom:8px;background:#e7edf2;color:var(--blue)}
.detail-head{display:flex;align-items:center;gap:9px;margin:5px 0 12px}
.detail-head .vehicle-icon{width:48px;height:48px}
.detail-head-text{min-width:0;flex:1}
.detail-head-text .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.vehicle-title-photo{width:48px;height:48px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex-shrink:0}
.info-dot{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:700;padding:0 2px;margin-left:5px;vertical-align:middle;cursor:pointer;line-height:1}
.vehicle-note textarea{width:100%;min-height:56px;resize:vertical}
.quick-actions-main{width:100%;margin:10px 0 12px;min-height:48px}
.quick-action-overlay{position:fixed;inset:0;z-index:1002;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px}
.quick-action-overlay .panel{width:100%;max-width:420px}
.quick-grid button{min-height:58px;text-align:left;padding:10px 12px}
.quick-grid button span{display:block;font-size:20px;margin-bottom:2px}
.quick-grid button small{font-size:12px}
.nav-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:#e8edf1;border-radius:13px;padding:4px;margin:10px 0}
.nav-tabs button{min-height:42px;padding:6px 2px;border-radius:10px;background:transparent;color:#56636e;font-size:10px;line-height:1.15}
.nav-tabs button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px #00000012}
.tab{display:none}.tab.active{display:block}
#detailContent>.panel{animation:softFade .18s ease-out both}
.item{border-top:1px solid var(--line);padding:11px 0}.item:first-child{border-top:0}
.item-actions{display:flex;gap:6px;margin-top:7px}.item-actions button{min-height:36px;padding:7px 10px;font-size:12px}
.cost{font-weight:750}
input,select,textarea{width:100%;height:46px;padding:10px 12px;border:1px solid #d7dde2;border-radius:11px;font-size:15px;background:#fff;margin:4px 0 11px}
textarea{height:auto}
label{display:block;font-size:11px;font-weight:650;color:#59646d;margin-top:3px}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.photo-wrap{position:relative}.photo{width:100%;height:145px;object-fit:cover;border-radius:11px;display:block}

.photo-zoom-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:18px}
.photo-zoom-overlay.hidden{display:none}
.photo-zoom-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.photo-zoom-close{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:46px;height:46px;min-height:46px;border-radius:50%;padding:0;background:#fff;color:#17324d;font-size:28px;line-height:1}

.photo-delete{position:absolute;right:5px;top:5px;width:34px;min-height:34px;padding:0;border-radius:50%;background:#b42318}
.file-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.doc button{min-height:36px;padding:7px 9px;font-size:12px}
.table-row{display:grid;grid-template-columns:75px 1fr 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.calendar-event{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}
.calendar-event:first-child{border-top:0}
.calendar-event-main{min-width:0;flex:1}
.calendar-event-date{font-weight:750;color:var(--blue);font-size:13px}
.calendar-event-title{font-weight:700;margin-top:3px}
.calendar-event-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.calendar-event-actions button{min-height:34px;padding:6px 9px;font-size:12px}
.install{margin:8px 0}
.kpi{font-size:12px;color:var(--muted);margin-top:10px}
.status-line{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#18864b;flex:none}.dot.warn{background:#b56b00}.dot.danger{background:#b42318}.dot.unknown{background:#7b8790}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.mini-card{background:#f7f9fa;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px}
.mini-card b{display:block;font-size:16px;margin-top:4px}
.history-entry{padding:10px 0;border-top:1px solid var(--line)}
.history-entry:first-child{border-top:0}
.small-action{min-height:36px;padding:7px 10px;font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;min-height:58px;border-radius:50%;font-size:25px;padding:0;box-shadow:0 5px 18px #00000030}
@media(min-width:561px){.fab{display:none}}

#appLock{position:fixed;inset:0;z-index:99999;background:#f4f6f8;display:flex;align-items:center;justify-content:center;padding:22px}
#appLock.hidden{display:none!important}
.lock-card{width:100%;max-width:390px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 35px #0002;text-align:center}
.lock-card h2{margin:8px 0;color:#17324d}
.lock-card p{color:#68747e;font-size:14px;line-height:1.45}
.lock-card input{width:100%;height:52px;border:1px solid #cbd5df;border-radius:12px;padding:0 14px;font-size:22px;letter-spacing:6px;text-align:center;margin:10px 0}
.lock-card button{width:100%;margin-top:8px}
#lockError{color:#68747e;min-height:20px;font-size:13px}
.unlock-track{position:relative;height:76px;border-radius:18px;background:#e9eef2;border:1px solid #d5dde4;margin:22px 0 10px;overflow:hidden;touch-action:pan-y;user-select:none}
.unlock-track-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:750;letter-spacing:.7px;color:#81909b;pointer-events:none}
.unlock-car{position:absolute;left:3px;top:5px;width:62px;height:64px;border-radius:14px;background:#17324d;color:white;display:grid;place-items:center;font-size:35px;box-shadow:0 3px 9px #0002;z-index:2;touch-action:none;cursor:grab;user-select:none}
.unlock-car:active{cursor:grabbing}
.unlock-garage{position:absolute;right:4px;top:5px;width:62px;height:64px;border-radius:13px;background:#d5e7d8;display:grid;place-items:center;font-size:35px;border:2px dashed #18864b}.lock-visual-only .unlock-track-label{display:none}.lock-visual-only{padding:18px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.unlock-track.unlocked{background:#d5e7d8}


.entry-form-overlay{position:fixed;inset:0;z-index:1100;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.entry-form-panel{width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:18px;background:var(--panel, #fff);padding:18px;box-shadow:0 18px 60px #0003}
.entry-form-panel h2{font-size:20px;margin:0 0 14px}
.entry-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.entry-form-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.entry-form-field.full{grid-column:1/-1}
.entry-form-field label{font-size:13px;font-weight:700;color:var(--text, #263238)}
.entry-form-field input,.entry-form-field select,.entry-form-field textarea{box-sizing:border-box;width:100%;min-height:44px;border:1px solid var(--line, #ccd3d8);border-radius:10px;padding:10px 11px;font:inherit;background:var(--bg, #fff);color:inherit}
.entry-form-field textarea{min-height:76px;resize:vertical}
.entry-form-check{display:flex;align-items:center;gap:9px;min-height:44px}
.entry-form-actions{display:flex;gap:10px;margin-top:16px}
.entry-form-actions button{flex:1}
@media(max-width:420px){.entry-form-grid{grid-template-columns:1fr}.entry-form-field.full{grid-column:auto}}

</style>

<body class="booting">
<header>
  <h1>🚗 Fahrzeugverwaltung</h1>
  <div class="sub">Dein Fuhrpark auf einen Blick <button id="logoutButton" class="secondary" style="float:right;min-height:30px;padding:4px 9px;font-size:12px;margin-top:-5px" onclick="logoutApp()">Abmelden</button></div>
</header>

<main>
<section id="home">
  <input id="search" class="search" placeholder="🔎 Fahrzeug suchen…">

  <div id="dashboard"></div>

  <div class="actions">
    <button class="primaryAction" onclick="newVehicle()">＋ Fahrzeug</button>
    <button class="secondary primaryAction" onclick="showInfoSettings()">⚙️ Info/Settings</button>
  </div>

  <div id="installArea" class="install hidden">
    <button class="secondary" style="width:100%" onclick="installApp()">📲 Als App installieren</button>
  </div>
  <input id="importInput" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this)">

  <div class="section-title">Meine Fahrzeuge</div>
  <div id="vehicleList"></div>
</section>

<section id="detail" class="hidden">
  <button class="back" onclick="showHome()">← Alle Fahrzeuge</button>
  <div id="detailContent"></div>
</section>

<section id="appointments" class="hidden">
  <button class="back" onclick="showHome()">← Zurück zur Übersicht</button>
  <div class="panel">
    <div class="title">📅 Alle Termine <button class="info-dot" aria-label="Information zu Terminen" onclick="showInfoText(&quot;Alle Termine&quot;,&quot;Hier siehst du Termine aus allen Fahrzeugen mit Datum, Status und zugehörigem Fahrzeug. Erledigte Termine kannst du wieder öffnen.&quot;)">i</button></div>
    <div id="appointmentList"></div>
    <div class="actions" id="notificationActionArea"><button class="secondary" id="notificationEnableButton" onclick="enableAppointmentNotifications()">🔔 Benachrichtigungen aktivieren</button></div>
    
  </div>
</section>
</main>



<div id="entryFormOverlay" class="entry-form-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="entryFormTitle" onclick="if(event.target===this)closeEntryForm()">
  <div class="entry-form-panel">
    <h2 id="entryFormTitle">Eintrag</h2>
    <form id="entryForm" onsubmit="submitEntryForm(event)">
      <div id="entryFormFields" class="entry-form-grid"></div>
      <div class="entry-form-actions">
        <button type="button" class="secondary" onclick="closeEntryForm()">Abbrechen</button>
        <button type="submit">Speichern</button>
      </div>
    </form>
  </div>
</div>

<div id="photoZoomOverlay" class="photo-zoom-overlay hidden" onclick="closePhotoZoom(event)">
  <button class="photo-zoom-close" type="button" onclick="closePhotoZoom()">×</button>
  <img id="photoZoomImage" src="" alt="Vergrößertes Fahrzeugfoto">
</div>


<div id="vehicleActions" class="hidden quick-action-overlay" role="dialog" aria-modal="true" aria-labelledby="vehicleActionsTitle" onclick="if(event.target===this)hideVehicleActions()">
  <div class="panel">
    <div class="row"><h2 id="vehicleActionsTitle" style="margin:0">Fahrzeugfunktionen</h2><button class="secondary" onclick="hideVehicleActions()" aria-label="Schließen">✕</button></div>
    <div class="actions" style="margin-top:12px">
      <button onclick="hideVehicleActions();addRepair()">🔧 Service</button>
      <button class="secondary" onclick="hideVehicleActions();addReminder()">🔔 Erinnerung</button>
      <button class="secondary" onclick="hideVehicleActions();addKmEntry()">📈 Kilometer</button>
      <button class="secondary" onclick="hideVehicleActions();document.getElementById('galleryInput').click()">📷 Foto hinzufügen</button>
    </div>
  </div>
</div>

<div id="costOverview" class="hidden" role="dialog" aria-modal="true" aria-labelledby="costOverviewTitle" style="position:fixed;inset:0;z-index:1000;background:#0008;overflow:auto;padding:18px">
  <div class="panel" style="max-width:700px;margin:8vh auto;padding:18px">
    <div class="row"><h2 id="costOverviewTitle" style="margin:0">💶 Kostenübersicht</h2><button class="secondary" onclick="hideCostOverview()" aria-label="Schließen">✕</button></div>
    <div id="costOverviewContent"></div>
  </div>
</div>

<div id="infoSettings" class="hidden" role="dialog" aria-modal="true" aria-labelledby="infoSettingsTitle" style="position:fixed;inset:0;z-index:1001;background:#0008;overflow:auto;padding:18px">
  <div class="panel" style="max-width:700px;margin:8vh auto;padding:18px">
    <div class="row"><h2 id="infoSettingsTitle" style="margin:0">⚙️ Info/Settings</h2><button class="secondary" onclick="hideInfoSettings()" aria-label="Schließen">✕</button></div>
    <div class="actions" style="margin-top:14px">
      <button class="secondary" onclick="hideInfoSettings();showCostOverview()">💶 Kostenübersicht</button>
      <button class="secondary" onclick="backup()">💾 Sichern (JSON)</button>
      <button class="secondary" onclick="document.getElementById('importInput').click()">📥 Import</button>
      <button class="secondary" onclick="showStorageInfo()">ℹ️ Speicherung</button>
    </div>
    <div class="muted" style="margin-top:10px">Fahrzeugdaten werden lokal auf diesem Gerät gespeichert. Erstelle regelmäßig eine JSON-Sicherung.</div>
  </div>
</div>

<div id="appLock" role="dialog" aria-modal="true" aria-label="Fuhrpark entsperren">
  <div class="lock-card lock-visual-only">
    <div class="unlock-track" id="unlockTrack" aria-label="Auto nach rechts in die Werkstatt schieben">
      <div class="unlock-car" id="unlockCar" role="button" tabindex="0" aria-label="Auto in die Werkstatt fahren">🚗</div>
      <div class="unlock-garage" id="unlockGarage" aria-hidden="true">🛠️</div>
    </div>
    <div id="lockError" aria-live="polite" class="visually-hidden"></div>
  </div>
</div>

<script>

// App-Sperre: PIN wird nur als SHA-256-Hash gespeichert. Dies ist eine Bedienungssperre,
// kein Ersatz für verschlüsselte Speicherung der Browserdaten.
const LOCK_HASH_KEY='fuhrpark_pin_hash_v1';
const LOCK_TIMEOUT=30*60*1000;
const LOCK_ACTIVITY_KEY='fuhrpark_last_activity_v2';
const LOCK_LOGOUT_KEY='fuhrpark_explicit_logout_v1';
let lastUserActivity=Date.now();
let appIsLocked=false;
function showLock(){
  appIsLocked=true;
  const overlay=document.getElementById('appLock');
  overlay.classList.remove('hidden');
  const logout=document.getElementById('logoutButton'); if(logout) logout.classList.add('hidden');
  document.getElementById('lockError').textContent='';
  resetUnlockCar();
}
function resetUnlockCar(){const car=document.getElementById('unlockCar');const track=document.getElementById('unlockTrack');if(car){car.style.left='3px';car.style.transition='left .18s ease';}if(track)track.classList.remove('unlocked');}
function hideLock(){
  appIsLocked=false;
  lastUserActivity=Date.now();
  try{localStorage.setItem(LOCK_ACTIVITY_KEY,String(lastUserActivity));localStorage.removeItem(LOCK_LOGOUT_KEY);}catch(_){}
  const logout=document.getElementById('logoutButton'); if(logout) logout.classList.remove('hidden');
  document.getElementById('appLock').classList.add('hidden');
}
(function setupCarUnlock(){
  const car=document.getElementById('unlockCar'), track=document.getElementById('unlockTrack');if(!car||!track)return;
  let dragging=false,startX=0,startLeft=3;
  function maxLeft(){return Math.max(3,track.clientWidth-car.offsetWidth-3);}
  function moveTo(clientX){const left=Math.max(3,Math.min(maxLeft(),startLeft+clientX-startX));car.style.transition='none';car.style.left=left+'px';return left;}
  function finish(){if(!dragging)return;dragging=false;const left=parseFloat(car.style.left)||3;if(left>=maxLeft()*.72){car.style.transition='left .12s ease';car.style.left=maxLeft()+'px';track.classList.add('unlocked');document.getElementById('lockError').textContent='';setTimeout(hideLock,180);}else{car.style.transition='left .18s ease';car.style.left='3px';}}
  car.addEventListener('pointerdown',e=>{if(!appIsLocked)return;dragging=true;startX=e.clientX;startLeft=parseFloat(car.style.left)||3;car.setPointerCapture?.(e.pointerId);e.preventDefault();});
  car.addEventListener('pointermove',e=>{if(dragging){moveTo(e.clientX);e.preventDefault();}});
  car.addEventListener('pointerup',finish);car.addEventListener('pointercancel',finish);
  car.addEventListener('keydown',e=>{if(appIsLocked&&(e.key==='ArrowRight'||e.key==='Enter'||e.key===' ')){e.preventDefault();car.style.left=maxLeft()+'px';track.classList.add('unlocked');document.getElementById('lockError').textContent='';setTimeout(hideLock,180);}});
})();
function noteUserActivity(){
  if(appIsLocked)return;
  lastUserActivity=Date.now();

const KEY="fuhrpark_mobile_v2";
const OLD_KEY="fuhrpark_mobile_v1";
let db={vehicles:[]};
let current=null;
let deferredInstallPrompt=null;
let formOriginalKm='';

const IDB_NAME='fuhrpark_datenbank_v1';
const IDB_STORE='appdata';
function openAppDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('Dieser Browser unterstützt IndexedDB nicht.'));return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_STORE))req.result.createObjectStore(IDB_STORE);};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Datenbank konnte nicht geöffnet werden.'));
  });
}
async function idbGet(){const d=await openAppDB();return new Promise((resolve,reject)=>{const tx=d.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get('fuhrpark');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);tx.oncomplete=()=>d.close();tx.onerror=()=>{d.close();reject(tx.error);};});}
async function idbPut(value){const d=await openAppDB();return new Promise((resolve,reject)=>{const tx=d.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(value,'fuhrpark');tx.oncomplete=()=>{d.close();resolve(true);};tx.onerror=()=>{d.close();reject(tx.error||new Error('Speichern fehlgeschlagen.'));};tx.onabort=()=>{d.close();reject(tx.error||new Error('Speichern abgebrochen.'));};});}
function normalizeDB(value){if(!value||!Array.isArray(value.vehicles))value={vehicles:[]};value.vehicles.forEach(v=>{if(!v.type)v.type='car';if(v.kba==null)v.kba='';if(!Array.isArray(v.repairs))v.repairs=[];if(!Array.isArray(v.photos))v.photos=[];if(!Array.isArray(v.documents))v.documents=[];if(!Array.isArray(v.reminders))v.reminders=[];if(!Array.isArray(v.kmHistory))v.kmHistory=[];if(!Array.isArray(v.fuelLogs))v.fuelLogs=[];if(!Array.isArray(v.tires))v.tires=[];if(!Array.isArray(v.history))v.history=[];if(!v.createdAt)v.createdAt=v.updatedAt||'';});return value;}
async function load(){
  try{
    const stored=await idbGet();
    let raw=null; try{raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);}catch(e){}
    // If IndexedDB is populated, it is authoritative. If it is empty, prefer recoverable legacy data.
    if(stored && Array.isArray(stored.vehicles) && stored.vehicles.length){db=normalizeDB(stored);requestPersistentStorage();return;}
    if(!raw && stored){db=normalizeDB(stored);requestPersistentStorage();return;}
    db=normalizeDB(raw?JSON.parse(raw):(stored||{vehicles:[]}));
    await idbPut(db);
    const verify=await idbGet();
    if(!verify || !Array.isArray(verify.vehicles) || verify.vehicles.length!==db.vehicles.length)throw new Error('Übernahme konnte nicht bestätigt werden');
    try{localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);}catch(e){}
    requestPersistentStorage();
  }catch(e){
    console.error(e);
    try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);if(raw){db=normalizeDB(JSON.parse(raw));alert('Die vorhandenen Daten wurden aus dem bisherigen Speicher geladen. Die Umstellung ist noch nicht vollständig bestätigt. Bitte nichts löschen und die Sicherung behalten.');return;}}catch(parseError){console.error(parseError);}
    alert('Der Fuhrpark-Speicher konnte nicht geöffnet werden. Bitte nichts löschen und die JSON-Sicherung behalten.');
  }
}
async function requestPersistentStorage(){try{if(navigator.storage?.persist)await navigator.storage.persist();}catch(e){console.warn('Persistenter Speicher nicht verfügbar',e);}}
function logHistory(action,details=''){if(!current)return;current.history=current.history||[];current.history.push({date:new Date().toISOString(),action,details});if(current.history.length>1000)current.history=current.history.slice(-1000);}
async function save(){
  try{
    // Jede gespeicherte Änderung am aktuell geöffneten Fahrzeug als letzte Aktivität markieren.
    if(current && db.vehicles.some(v=>v.id===current.id)) current.updatedAt=new Date().toISOString();
    await idbPut(db);return true;
  }
  catch(e){alert('Speichern fehlgeschlagen. Deine letzte JSON-Sicherung bitte unbedingt behalten. Prüfe den freien Gerätespeicher.');console.error(e);return false;}
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function euro(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n||0));}
function vehicleType(v){return v.type==='motorcycle'?'Motorrad':'Auto';}
function vehicleIcon(v){return v.type==='motorcycle'?'🏍️':'🚗';}
function num(v){return Number(String(v??'').replace(',','.'))||0;}
function maintenanceState(v){
  const today=new Date();today.setHours(0,0,0,0);let dates=[];
  if(v.tuv)dates.push(v.tuv);(v.reminders||[]).filter(r=>!r.done&&r.date).forEach(r=>dates.push(r.date));(v.documents||[]).filter(d=>d.expiry).forEach(d=>dates.push(d.expiry));
  const tire=(v.tires||[]).filter(t=>t.status!=='eingelagert'&&num(t.treadDepth)>0);if(tire.some(t=>num(t.treadDepth)<1.6))return {level:'danger',label:'Reifen kritisch'};
  const days=dates.map(x=>Math.floor((new Date(x+'T00:00:00')-today)/86400000));
  if(days.some(d=>d<0))return {level:'danger',label:'Wartung fällig'};
  if(days.some(d=>d<=30))return {level:'warn',label:'Bald fällig'};
  if(dates.length)return {level:'ok',label:'Keine Fälligkeit nah'};
  return {level:'unknown',label:'Keine Fälligkeiten'};
}
function status(v){
  if(!v.tuv) return "";
  let d=new Date(v.tuv+"T00:00:00"), now=new Date(), days=(d-now)/86400000;
  return days<0?'<span class="badge danger">TÜV fällig</span>':days<45?'<span class="badge warn">TÜV bald</span>':'<span class="badge">TÜV OK</span>';
}

function averageFuelConsumption(logs){
  const list=(logs||[]).filter(x=>num(x.km)>0&&num(x.liters)>0).slice().sort((a,b)=>num(a.km)-num(b.km));
  let previousFull=null,totalLiters=0,totalKm=0;
  for(const item of list){
    if(item.fullTank){
      if(previousFull){
        const distance=num(item.km)-num(previousFull.km);
        const liters=list.filter(x=>num(x.km)>num(previousFull.km)&&num(x.km)<=num(item.km)).reduce((sum,x)=>sum+num(x.liters),0);
        if(distance>0&&liters>0){totalLiters+=liters;totalKm+=distance;}
      }
      previousFull=item;
    }
  }
  return totalKm>0?totalLiters/totalKm*100:null;
}

async function enableAppointmentNotifications(){
  const button=document.getElementById('notificationEnableButton');
  // Nutzerwunsch: Schaltfläche nach dem ersten Antippen dauerhaft ausblenden.
  try{localStorage.setItem('fuhrpark_notification_button_used_v1','1');}catch(_){}
  if(button)button.remove();
  const area=document.getElementById('notificationActionArea');if(area&&!area.children.length)area.remove();
  if(!('Notification' in window)){alert('Dieser Browser unterstützt keine Benachrichtigungen.');return;}
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){alert('Benachrichtigungen wurden nicht erlaubt. Die Schaltfläche bleibt wie gewünscht ausgeblendet.');return;}
  alert('Benachrichtigungen sind aktiviert. Diese Version prüft Termine nur, solange die App geöffnet ist. Für zuverlässige Push-Nachrichten bei geschlossener App ist ein Push-Dienst erforderlich.');
  checkAppointmentNotifications();
}
function syncNotificationButton(){if(localStorage.getItem('fuhrpark_notification_button_used_v1')==='1'){document.getElementById('notificationEnableButton')?.remove();const a=document.getElementById('notificationActionArea');if(a&&!a.children.length)a.remove();}}
function checkAppointmentNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(); const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  db.vehicles.forEach(v=>(v.reminders||[]).forEach(r=>{
    if(!r.done&&r.date===today){
      const key='fuhrpark-notified-'+v.id+'-'+r.date+'-'+r.title;
      if(!localStorage.getItem(key)){
        try{new Notification('Fahrzeugtermin: '+(r.title||'Termin'),{body:(v.name||'Fahrzeug')+(v.plate?' · '+v.plate:'')+(r.note?' — '+r.note:''),icon:'./icon-192.png'});localStorage.setItem(key,'1');}catch(e){console.error(e);}
      }
    }
  }));
}

function renderAppointments(){
  const host=document.getElementById('appointmentList'); if(!host)return;
  const items=[];
  db.vehicles.forEach(v=>(v.reminders||[]).forEach((r,i)=>items.push({v,r,i})));
  items.sort((a,b)=>String(a.r.date||'').localeCompare(String(b.r.date||'')));
  if(!items.length){host.innerHTML='<div class="empty">Noch keine Termine gespeichert.</div>';return;}
  host.innerHTML=items.map(({v,r,i})=>{
    const vehicle=esc([v.name||'Fahrzeug',v.plate||''].filter(Boolean).join(' · '));
    return `<div class="calendar-event"><div class="calendar-event-main"><div class="calendar-event-date">${esc(r.date||'Ohne Datum')}${r.done?' · Erledigt':' · Offen'}</div><div class="calendar-event-title">${esc(r.title||'Termin')}</div><div class="muted">${v.type==='motorcycle'?'🏍️':'🚗'} ${vehicle}${v.model?' · '+esc(v.model):''}</div>${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</div><div class="calendar-event-actions"><button class="secondary" onclick="openVehicle('${esc(v.id)}')">Fahrzeug</button><button class="secondary" onclick="exportReminderToCalendar('${esc(v.id)}',${i})">Kalender</button>${!r.done?`<button class="secondary" onclick="markAppointmentDone('${esc(v.id)}',${i})">✓ Erledigt</button>`:''}</div></div>`;
  }).join('');
}
async function markAppointmentDone(vehicleId,index){
  const v=db.vehicles.find(x=>x.id===vehicleId); if(!v||!v.reminders||!v.reminders[index])return;

function icsEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function exportReminderToCalendar(vehicleId,index){
  const v=db.vehicles.find(x=>x.id===vehicleId); const r=v&&(v.reminders||[])[index];
  if(!v||!r){alert('Termin nicht gefunden.');return;}
  if(!r.date||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)){alert('Dieser Termin hat kein gültiges Datum.');return;}
  const start=r.date.replace(/-/g,''); const next=new Date(r.date+'T00:00:00'); next.setDate(next.getDate()+1);
  const end=next.getFullYear()+String(next.getMonth()+1).padStart(2,'0')+String(next.getDate()).padStart(2,'0');
  const details=`Fahrzeug: ${v.name||'Fahrzeug'}${v.plate?' ('+v.plate+')':''}${v.model?' - '+v.model:''}\n${r.note||''}`;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fuhrpark//Termine//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:fuhrpark-'+encodeURIComponent(v.id)+'-'+index+'@local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+icsEscape(r.title||'Fahrzeugtermin'),'DESCRIPTION:'+icsEscape(details),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'})); const a=document.createElement('a'); a.href=url; a.download='termin-'+start+'.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  alert('Kalenderdatei erstellt. Öffne die .ics-Datei auf dem Smartphone und füge den Termin deinem Kalender hinzu.');
}

async function editKmEntry(index){
  const entry=(current.kmHistory||[])[index];if(!entry)return;
  const km=prompt('Kilometerstand:',String(entry.km??''));if(km===null)return;
  const n=Number(String(km).replace(',','.'));
  if(!Number.isFinite(n)||n<0){alert('Bitte einen gültigen Kilometerstand eingeben.');return;}
  const date=prompt('Datum (JJJJ-MM-TT):',String(entry.date||new Date().toISOString().slice(0,10)));if(date===null||!date.trim())return;
  const note=prompt('Notiz (optional):',String(entry.note||''));if(note===null)return;
  const before=`${entry.km} km · ${entry.date||''}`;
  entry.km=String(Math.round(n));entry.date=date.trim();entry.note=note;
  syncCurrentKmFromHistory();
  logHistory('Kilometerhistorie bearbeitet',`${before} → ${entry.km} km · ${entry.date}`);
  if(await save())renderDetail();
}
async function deleteKmEntry(index){
  const entry=(current.kmHistory||[])[index];if(!entry)return;
  if(!confirm(`Kilometerstand vom ${entry.date||'unbekannten Datum'} (${entry.km} km) wirklich löschen?`))return;
  current.kmHistory.splice(index,1);syncCurrentKmFromHistory();

  if(await save())renderDetail();
}

function resizeImage(file,maxWidth=1000,quality=.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=e=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addPhoto(input){ await addPhotos(input,false); }
async function addPhotos(input,multiple=true){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  try{
    for(const file of files){
      if(!file.type.startsWith('image/'))continue;
      const data=await resizeImage(file);
      current.photos=current.photos||[];
      current.photos.push(data);logHistory('Foto hinzugefügt',file.name||'Fahrzeugfoto');
    }
    if(await save())renderDetail();
  }catch(e){alert("Das Foto konnte nicht geladen werden.");console.error(e);}
  input.value='';
}

async function addKmEntry(){

  const date=prompt("Datum (JJJJ-MM-TT):",new Date().toISOString().slice(0,10));

async function addDocuments(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  const category=prompt('Dokumentkategorie (z. B. Fahrzeugschein, Versicherung, TÜV, Rechnung):','Sonstiges');
  if(category===null){input.value='';return;}
  const expiry=prompt('Ablaufdatum (JJJJ-MM-TT), falls vorhanden; sonst leer lassen:','')||'';
  const note=prompt('Notiz zum Dokument (optional):','')||'';
  current.documents=current.documents||[];
  for(const file of files){
    if(file.size>8*1024*1024){alert(`"${file.name}" ist größer als 8 MB und wurde übersprungen.`);continue;}
    const data=await fileToDataUrl(file);
    current.documents.push({name:file.name,type:file.type,size:file.size,data,category:category.trim()||'Sonstiges',expiry:/^\d{4}-\d{2}-\d{2}$/.test(expiry)?expiry:'',note});
    logHistory('Dokument hinzugefügt',`${file.name} · ${category}`);
  }
  if(await save())renderDetail();input.value='';
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
  });
}
function openDocument(i){
  const d=current.documents[i];

}

let entryFormSaveHandler = null;
function openEntryForm(title, fields, onSave){
  const overlay=document.getElementById('entryFormOverlay');
  const host=document.getElementById('entryFormFields');
  document.getElementById('entryFormTitle').textContent=title;
  entryFormSaveHandler=onSave;
  host.innerHTML=fields.map((f,i)=>{
    const id='entryField_'+i;
    if(f.type==='checkbox'){
      return `<div class="entry-form-field full"><label class="entry-form-check"><input id="${id}" name="${esc(f.name)}" type="checkbox" ${f.value?'checked':''}> <span>${esc(f.label)}</span></label></div>`;
    }
    let control='';
    if(f.type==='select'){
      control=`<select id="${id}" name="${esc(f.name)}" ${f.required?'required':''}>${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }else if(f.type==='textarea'){
      control=`<textarea id="${id}" name="${esc(f.name)}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>${esc(f.value??'')}</textarea>`;
    }else{
      control=`<input id="${id}" name="${esc(f.name)}" type="${f.type||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${f.min!==undefined?`min="${esc(String(f.min))}"`:''} ${f.step!==undefined?`step="${esc(String(f.step))}"`:''}>`;
    }
    return `<div class="entry-form-field ${f.full?'full':''}"><label for="${id}">${esc(f.label)}${f.required?' *':''}</label>${control}</div>`;
  }).join('');
  overlay.classList.remove('hidden');
  const first=host.querySelector('input:not([type=checkbox]),select,textarea');
  if(first) setTimeout(()=>first.focus(),50);
}
function closeEntryForm(){
  document.getElementById('entryFormOverlay')?.classList.add('hidden');
  entryFormSaveHandler=null;
}
async function submitEntryForm(event){
  event.preventDefault();
  if(!entryFormSaveHandler)return;
  const form=document.getElementById('entryForm');
  if(!form.reportValidity())return;
  const data={};
  new FormData(form).forEach((value,key)=>data[key]=value);
  form.querySelectorAll('input[type=checkbox]').forEach(input=>data[input.name]=input.checked);
  const handler=entryFormSaveHandler;
  closeEntryForm();
  await handler(data);
}

    {name:'liters',label:'Getankte Liter',type:'number',value:'',min:0.01,step:0.01,required:true},
    {name:'price',label:'Gesamtpreis (€)',type:'number',value:'',min:0,step:0.01,required:true},

    {name:'note',label:'Notiz (optional)',type:'textarea',value:'',full:true}
  ],async d=>{
    const liters=num(d.liters),price=num(d.price),km=num(d.km);

function renderHistory(v){const h=(v.history||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,100);if(!h.length)return '<div class="empty">Noch keine Historieneinträge. Neue Änderungen werden künftig protokolliert.</div>';return h.map(x=>`<div class="history-entry"><b>${esc(x.action||'Änderung')}</b><div class="muted">${esc((x.date||'').replace('T',' ').slice(0,16))}</div>${x.details?`<div>${esc(x.details)}</div>`:''}</div>`).join('');}

function downloadText(filename,text,mime){const blob=new Blob(['\ufeff',text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function vehicleReportRows(v){
  const rows=[['Bereich','Datum','Fahrzeug','Kennzeichen','Details','Kilometer','Zusatz']];
  const name=v.name||'Fahrzeug';
  rows.push(['Fahrzeugdaten','',name,v.plate||'',`${vehicleType(v)} · ${v.model||''} · KBA ${v.kba||''} · FIN ${v.vin||''}`,v.km||'',`Baujahr ${v.year||''}; TÜV ${v.tuv||''}`]);
  // Serviceeinträge (inkl. Inspektionen) nach tatsächlichem Servicedatum sortieren.
  (v.repairs||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))).forEach(r=>{
    rows.push([r.type||'Service/Reparatur',r.date||'',name,v.plate||'',`${r.note||''}${r.workshop?' · Werkstatt: '+r.workshop:''}`,r.km||'','']);
  });
  return rows;
}
function exportVehicleCSV(id){const v=db.vehicles.find(x=>x.id===id);if(!v)return;downloadText(`fuhrpark-${(v.plate||v.name||'fahrzeug').replace(/[^a-z0-9_-]/gi,'_')}.csv`,vehicleReportRows(v).map(row=>row.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function exportAllCSV(){const rows=[['Bereich','Datum','Fahrzeug','Kennzeichen','Details','Kilometer','Zusatz']];db.vehicles.forEach(v=>rows.push(...vehicleReportRows(v).slice(1)));downloadText('fuhrpark-gesamtbericht.csv',rows.map(row=>row.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function printVehicleReport(id){const v=db.vehicles.find(x=>x.id===id);if(!v)return;const rows=vehicleReportRows(v);const win=window.open('','_blank');if(!win){alert('Der Bericht wurde vom Browser blockiert. Erlaube bitte Pop-ups für die Fuhrpark-App und versuche es erneut.');return;}const body=rows.map((r,i)=>'<tr>'+r.map(c=>i===0?'<th>'+esc(c)+'</th>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('');win.document.open();win.document.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Fuhrparkbericht</title><style>body{font:12px Arial,sans-serif;padding:20px;color:#17212b}h1{font-size:20px}table{border-collapse:collapse;width:100%;font-size:10px}td,th{border:1px solid #bbb;padding:5px;text-align:left;vertical-align:top}th{background:#e8edf3}@media print{button{display:none}}</style></head><body><h1>Fahrzeugbericht: ${esc(v.name||'Fahrzeug')}</h1><p>${esc(v.plate||'')} · ${esc(v.model||'')} · erstellt am ${new Date().toLocaleDateString('de-DE')}</p><button onclick="window.print()">Drucken / als PDF speichern</button><table>${body}</table><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);win.document.close();}

function formatBytes(n){
  if(n<1024)return n+' B';
  if(n<1024*1024)return Math.round(n/1024)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
async function showStorageInfo(){
  let quotaText='';
  try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();quotaText=`\n\nGeschätzte Browsernutzung: ${formatBytes(e.usage||0)} von ${formatBytes(e.quota||0)}.`;}}catch(e){}
  let persistentText='';
  try{if(navigator.storage?.persisted)persistentText='\nDauerhafter Browser-Speicher: '+((await navigator.storage.persisted())?'erteilt':'nicht bestätigt');}catch(e){}
  alert("Die Fahrzeugdaten werden lokal in der Browser-Datenbank auf diesem Gerät gespeichert. Es gibt keinen automatischen Cloud-Server.\n\nDie Schaltfläche „Sichern“ erstellt eine JSON-Datei mit Fahrzeugen, Wartungen, Erinnerungen, Kilometerständen, Fotos, Dokumenten, Tankbuch, Reifen und Historie. Bitte regelmäßig außerhalb der App sichern.\n\nBrowserdaten löschen oder Website-Daten zurücksetzen kann lokale Daten entfernen. Eine Sicherungsdatei schützt davor."+quotaText+persistentText);
}
async function importBackup(input){
  const file=input.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    const imported=JSON.parse(text);
    if(!imported || !Array.isArray(imported.vehicles))throw new Error("Ungültige Sicherung");
    if(!confirm(`Sicherung mit ${imported.vehicles.length} Fahrzeugen importieren? Die aktuellen Daten werden ersetzt.`))return;
    db=normalizeDB(imported); if(!await save())throw new Error("Speichern der Sicherung fehlgeschlagen"); showHome();
    alert("Sicherung importiert.");
  }catch(e){alert("Die Sicherungsdatei konnte nicht importiert werden.");console.error(e);}
  input.value='';
}
